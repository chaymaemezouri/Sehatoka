# Virtual host dédié à Sehatoka.
# À copier sur le VPS, par exemple vers /etc/nginx/sites-available/sehatoka,
# puis à activer par un lien dans sites-enabled. Ne pas modifier les autres sites.
# Ce fichier n'est pas installé par le projet.

server {
    listen 80;
    listen [::]:80;
    server_name sehatoka.academyskills.net;

    root /opt/sehatoka/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
